<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0d14" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="えもじあっと" />
		<meta property="og:title" content="えもじあっと (EmojiAt)" />
		<meta property="og:description" content="A Bluemoji generator. Type some text and get a custom emoji, still or animated, for AT Protocol apps." />
		<meta property="og:url" content="https://emojiat.suibari.com/" />
		<meta property="og:image" content="https://emojiat.suibari.com/ogp.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
